name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main # অথবা master (আপনার প্রধান ব্রাঞ্চের নাম অনুযায়ী)

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Dependencies
        run: npm ci

      - name: Build Project
        run: npm run build

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' # যদি সার্ভিস অ্যাকাউন্ট কি ব্যবহার করে থাকেন
          # অথবা যদি FIREBASE_TOKEN ব্যবহার করে থাকেন, তবে নিচের লাইনটি ব্যবহার করতে পারেন:
          # firebaseToken: '${{ secrets.FIREBASE_TOKEN }}'
          channelId: live
          projectId: cv-builder-27bef